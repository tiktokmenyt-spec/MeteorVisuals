<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteor Visuals — HTML Preview</title>
  <style>
    :root { --purple: #8A2BE2; --gold: #FFD700; --bg: #090511; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #fff; font: 14px system-ui, sans-serif; background: #090511; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .panel { position: fixed; top: 24px; left: 24px; width: min(330px, calc(100vw - 48px)); padding: 20px; border: 1px solid #8A2BE288; border-radius: 14px; background: #10091ddd; backdrop-filter: blur(6px); }
    h1 { margin: 0 0 6px; color: var(--gold); font-size: 22px; letter-spacing: .06em; }
    p { margin: 0 0 16px; color: #d9cfee; }
    label { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: #eee; cursor: pointer; }
    input { accent-color: var(--purple); }
    button { width: 100%; padding: 10px; border: 1px solid var(--gold); border-radius: 8px; color: #12091c; background: var(--gold); font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(1.12); }
    .badge { position: fixed; top: 24px; right: 24px; padding: 9px 13px; border: 1px solid #FFD70099; border-radius: 999px; color: var(--gold); background: #160b22; }
    .credit { position: fixed; right: 24px; bottom: 20px; color: #bdaed2; }
  </style>
</head>
<body>
  <canvas id="visuals" aria-label="Meteor Visuals HTML preview"></canvas>
  <section class="panel">
    <h1>METEOR VISUALS</h1>
    <p>Интерактивная HTML-презентация визуального стиля — без Minecraft.</p>
    <label><input id="ring" type="checkbox" checked> Pulse-кольцо</label>
    <label><input id="trails" type="checkbox" checked> Фиолетово-золотые трейлы</label>
    <label><input id="mist" type="checkbox" checked> Ночной фиолетовый туман</label>
    <button id="pulse">Запустить Pulse</button>
  </section>
  <div class="badge">HTML PREVIEW · CLIENT VISUALS</div>
  <div class="credit">Dark Purple #8A2BE2 · Gold #FFD700</div>
<script>
const canvas = document.querySelector('#visuals');
const ctx = canvas.getContext('2d', { alpha: false });
const ring = document.querySelector('#ring');
const trails = document.querySelector('#trails');
const mist = document.querySelector('#mist');
const pulse = document.querySelector('#pulse');
let w = 0, h = 0, t = 0, energy = 0, burst = 0, lastFrame = 0;
const FPS_LIMIT = 40;
const particles = Array.from({ length: 55 }, () => ({
  a: Math.random() * Math.PI * 2,
  r: 30 + Math.random() * 250,
  s: .002 + Math.random() * .005,
  z: Math.random()
}));

function resize() {
  // Capping DPR prevents huge 4K/retina canvases from multiplying every draw cost.
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(w * dpr));
  canvas.height = Math.max(1, Math.floor(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize, { passive: true });
resize();
pulse.addEventListener('click', () => { energy = 1; burst = 1; });

function frame(now) {
  if (now - lastFrame < 1000 / FPS_LIMIT) {
    requestAnimationFrame(frame);
    return;
  }
  lastFrame = now;
  t = now * 0.001;
  energy += (0 - energy) * 0.035;
  burst *= 0.93;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#090511';
  ctx.fillRect(0, 0, w, h);

  const cx = w * 0.58;
  const cy = h * 0.53;
  const scale = 1 + energy * 0.2 + Math.sin(t * 2) * 0.02;

  if (mist.checked) {
    const g = ctx.createRadialGradient(cx, cy, 30, cx, cy, Math.max(w, h) * 0.65);
    g.addColorStop(0, '#8A2BE21c');
    g.addColorStop(1, '#09051100');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  // Shadows are intentionally disabled; compositing is limited to the effect groups.
  if (trails.checked) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.22);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, 115 + i * 22 + energy * 25, -0.8 + i * 0.2, 0.45 + i * 0.2);
      ctx.strokeStyle = i % 2 ? '#FFD700aa' : '#8A2BE2aa';
      ctx.stroke();
    }
    ctx.restore();
  }

  if (ring.checked) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(t * 0.6);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 30; i++) {
      const a = i * Math.PI * 2 / 30;
      const r = 82 + Math.sin(t * 3 + i * 0.4) * 4;
      ctx.fillStyle = i < 15 ? '#8A2BE2' : '#FFD700';
      ctx.fillRect(Math.cos(a) * r - 1.5, Math.sin(a) * r - 1.5, 3, 3);
    }
    ctx.restore();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    p.a += p.s;
    const r = p.r + burst * 70 * p.z;
    const x = cx + Math.cos(p.a) * r;
    const y = cy + Math.sin(p.a) * r * 0.62;
    ctx.fillStyle = p.z > 0.5 ? '#FFD700cc' : '#8A2BE2cc';
    const size = p.z > 0.7 ? 3 : 2;
    ctx.fillRect(x, y, size, size);
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
