<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteor Visuals — Lightweight HTML Preview</title>
  <style>
    :root { --purple:#8A2BE2; --gold:#FFD700; --bg:#090511; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { color:#fff; font:14px system-ui,sans-serif; background:var(--bg); }
    .scene { position:fixed; inset:0; overflow:hidden; background:radial-gradient(circle at 58% 53%, #281044 0, var(--bg) 58%); }
    .mist { position:absolute; inset:-20%; pointer-events:none; opacity:.7; background:radial-gradient(ellipse at 58% 53%, #8A2BE233 0, transparent 55%); }
    .core { position:absolute; left:58%; top:53%; width:180px; height:180px; transform:translate(-50%,-50%); border:2px solid #8A2BE2aa; border-radius:50%; box-shadow:0 0 24px #8A2BE244; animation:pulse 3s ease-in-out infinite; }
    .core::after { content:""; position:absolute; inset:14px; border:2px solid #FFD700aa; border-radius:50%; animation:spin 8s linear infinite; }
    .trail { position:absolute; left:58%; top:53%; width:280px; height:150px; transform:translate(-50%,-50%) rotate(-18deg); border:2px solid #FFD70088; border-left-color:transparent; border-right-color:transparent; border-radius:50%; animation:spin 12s linear infinite; }
    .trail.two { width:340px; height:190px; transform:translate(-50%,-50%) rotate(28deg); border-color:#8A2BE288; border-left-color:transparent; border-right-color:transparent; animation-direction:reverse; animation-duration:16s; }
    .paused *, .paused::after { animation-play-state:paused !important; }
    .panel { position:fixed; top:24px; left:24px; width:min(330px,calc(100vw - 48px)); padding:20px; border:1px solid #8A2BE288; border-radius:14px; background:#10091d; }
    h1 { margin:0 0 6px; color:var(--gold); font-size:22px; letter-spacing:.06em; }
    p { margin:0 0 16px; color:#d9cfee; }
    label { display:flex; align-items:center; gap:10px; margin:12px 0; color:#eee; cursor:pointer; }
    input { accent-color:var(--purple); }
    button { width:100%; padding:10px; border:1px solid var(--gold); border-radius:8px; color:#12091c; background:var(--gold); font-weight:700; cursor:pointer; }
    .badge { position:fixed; top:24px; right:24px; padding:9px 13px; border:1px solid #FFD70099; border-radius:999px; color:var(--gold); background:#160b22; }
    .credit { position:fixed; right:24px; bottom:20px; color:#bdaed2; }
    @keyframes spin { to { transform:translate(-50%,-50%) rotate(342deg); } }
    @keyframes pulse { 0%,100% { transform:translate(-50%,-50%) scale(.96); opacity:.7; } 50% { transform:translate(-50%,-50%) scale(1.04); opacity:1; } }
    @media (prefers-reduced-motion:reduce) { *,*::after { animation:none !important; } }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="mist" id="mistEffect"></div>
    <div class="trail" id="trailEffect"></div>
    <div class="trail two" id="trailEffectTwo"></div>
    <div class="core" id="ringEffect"></div>
  </main>
  <section class="panel">
    <h1>METEOR VISUALS</h1>
    <p>Облегчённая HTML-презентация без Canvas и постоянного JavaScript-рендера.</p>
    <label><input id="ring" type="checkbox" checked> Pulse-кольцо</label>
    <label><input id="trails" type="checkbox" checked> Фиолетово-золотые трейлы</label>
    <label><input id="mist" type="checkbox" checked> Ночной фиолетовый туман</label>
    <button id="pulse">Пауза анимации</button>
  </section>
  <div class="badge">LIGHT HTML PREVIEW</div>
  <div class="credit">Dark Purple #8A2BE2 · Gold #FFD700</div>
<script>
const scene = document.querySelector('#scene');
const ring = document.querySelector('#ring');
const trails = document.querySelector('#trails');
const mist = document.querySelector('#mist');
const button = document.querySelector('#pulse');
const ringEffect = document.querySelector('#ringEffect');
const trailEffects = [document.querySelector('#trailEffect'), document.querySelector('#trailEffectTwo')];
const mistEffect = document.querySelector('#mistEffect');
ring.addEventListener('change', () => ringEffect.hidden = !ring.checked);
trails.addEventListener('change', () => trailEffects.forEach(el => el.hidden = !trails.checked));
mist.addEventListener('change', () => mistEffect.hidden = !mist.checked);
button.addEventListener('click', () => {
  scene.classList.toggle('paused');
  button.textContent = scene.classList.contains('paused') ? 'Запустить анимацию' : 'Пауза анимации';
});
</script>
</body>
</html>
